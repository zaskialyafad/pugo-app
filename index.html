<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ee5f8f"><meta name="apple-mobile-web-app-capable" content="yes">
<title>PUGO Kasir</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff3f7;--card:#fff;--tx:#5a1638;--mu:#95697d;--pr:#e0487f;--bd:#f6cddc;--dn:#b3261e;--gr:#e3edb8;--gd:#6f9a6f;--mr:#7a1f4b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2b1120;--card:#3b1a2e;--tx:#ffe8f0;--mu:#d3a4ba;--pr:#ff7aa8;--bd:#5a2a45;--dn:#ff9a92;--gr:#4a5a34;--gd:#a8cf9a;--mr:#ffc2d9}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px Fredoka,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:150px}
header{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px 8px}header img.lg{height:54px}header img.mc{height:40px}
nav{display:flex;gap:4px;padding:0 12px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 2px;font-size:13px;border:0;border-radius:10px;background:transparent;color:var(--mu);font-weight:600}
nav button.on{background:var(--pr);color:#fff;box-shadow:0 2px 0 var(--mr)}nav button{font-family:inherit}
main{padding:0 12px;max-width:720px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px}
.p{text-align:left;color:var(--tx);cursor:pointer;position:relative}
.p{border-color:var(--gr)}.p:active{transform:scale(.97)}.p b{display:block}.p span{color:var(--pr);font-weight:600}
.badge{font-style:normal;position:absolute;top:6px;right:6px;background:var(--gd);color:#fff;border-radius:99px;min-width:22px;text-align:center;font-size:12px;padding:2px 6px}
button,input,select,textarea{font-family:inherit}button{font-size:inherit;cursor:pointer}
.btn{background:var(--pr);color:#fff;border:0;border-radius:99px;box-shadow:0 2px 0 var(--mr);padding:11px 16px;font-weight:600}
.btn.g{background:transparent;color:var(--pr);border:2px solid var(--pr);box-shadow:none}.btn.d{background:var(--dn)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.list>.card{margin-bottom:8px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));max-height:45vh;overflow:auto}
.q{display:inline-flex;align-items:center;gap:6px}.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.sum .card b{font-size:18px;display:block}
pre{background:#fff;color:#000;padding:14px;border-radius:8px;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;margin:0 0 10px}
#qr{display:flex;justify-content:center;background:#fff;padding:14px;border-radius:12px}
.hide{display:none}h3,h4{color:var(--mr)}.emp{text-align:center;padding:24px 12px}.emp img{height:80px;display:block;margin:0 auto 8px}#bar{border-top:3px solid var(--gr);border-radius:18px 18px 0 0}.sheet{border-top:6px solid var(--gr)}.mu{color:var(--mu);font-size:13px}
@media print{body>*:not(#print){display:none!important}#print{display:block!important;position:static}}
#print{display:none}

/* v2 UI */
body{padding-bottom:190px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;justify-content:space-between;max-width:720px;margin:auto;padding:10px 14px 6px}
#chip{background:var(--gr);color:var(--mr);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;text-align:right;line-height:1.25}#chip b{display:block;font-size:14px}
nav{position:fixed;left:0;right:0;top:auto;bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--bd);z-index:8;gap:2px}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:6px 2px;border-radius:14px;color:var(--mu)}
nav button i{font-style:normal;font-size:21px}
nav button.on{background:var(--gr);color:var(--mr);box-shadow:none}
.srch{font-size:16px;padding:12px 14px;border-radius:99px;margin:2px 0 10px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.p{display:flex;flex-direction:column;gap:2px;min-height:124px;padding:14px 12px}
.p:active{transform:scale(.97)}.p b{font-weight:600}.p small{font-size:12px}.p span{margin-top:auto;font-size:15px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#5a1638;margin-bottom:6px;overflow:hidden;background-size:cover;background-position:center}
.thumb{width:100%;aspect-ratio:1.6;object-fit:cover;border-radius:10px;margin-bottom:6px;background:var(--gr)}
.pimg{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}
.imgpick{width:100%;aspect-ratio:1.6;border-radius:14px;border:2px dashed var(--bd);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mu);cursor:pointer;overflow:hidden;margin-bottom:10px;position:relative}
.imgpick img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.imgpick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.imgpick .rm{position:absolute;top:6px;right:6px;background:#0008;color:#fff;border-radius:50%;width:28px;height:28px;border:0;font-size:15px;z-index:2}
.mn{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:2px solid var(--pr);background:var(--card);color:var(--pr);font-size:20px;line-height:1;padding:0}
.btn{min-height:44px}.btn.big{padding:14px 26px;font-size:17px}
#bar{left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:704px;margin:auto;border:2px solid var(--gr);border-radius:20px;box-shadow:0 6px 24px #0003;padding:10px 12px}
#bar .items{max-height:32vh;overflow:auto;margin-bottom:8px;border-bottom:1px dashed var(--bd);padding-bottom:4px}
.modal{align-items:flex-end}
.sheet{max-width:680px;max-height:96%;min-height:58vh;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px;min-height:0}}
.sheet input,.sheet select{font-size:17px;padding:14px}
.ph{text-align:center;margin-bottom:12px}.ph .tt{font-size:36px;font-weight:700;color:var(--mr)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.seg button{padding:12px 4px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;font-size:14px}
.seg button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.chips button{padding:10px 14px;border-radius:99px;border:2px solid var(--pr);background:transparent;color:var(--pr);font-weight:600}
#qr{padding:18px}#qr img,#qr canvas{max-width:100%;height:auto}
.kem{font-size:22px;font-weight:700;color:var(--gd)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--mr);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translateX(-50%)}
.sec{margin-bottom:12px}.sec h4{margin:0 0 8px}.chip2{font-size:12px;border-radius:99px;padding:2px 8px;background:var(--gr);color:var(--mr)}
textarea.code{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:11px/1.4 ui-monospace,monospace}
</style></head><body>

function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function qrisDyn(str,amt){str=str.trim();let i=0,t=[];while(i<str.length-8){const id=str.substr(i,2),ln=+str.substr(i+2,2),v=str.substr(i+4,ln);if(id==='63'||isNaN(ln))break;if(id!=='54')t.push([id,id==='01'?'12':v]);i+=4+ln}
const a=String(Math.round(amt)),k=t.findIndex(x=>x[0]==='53');t.splice(k+1,0,['54',a]);
const b=t.map(([id,v])=>id+String(v.length).padStart(2,'0')+v).join('')+'6304';return b+crc16(b)}

// ===== BACKEND (Google Sheets via Apps Script) =====
async function api(action,payload){
 if(!cfg.backendUrl)throw new Error('no-backend');
 const r=await fetch(cfg.backendUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload))});
 const j=await r.json();
 if(!j.ok)throw new Error(j.error||'failed');
 return j;
}
async function apiGet(){
 const sep=cfg.backendUrl.includes('?')?'&':'?';
 const r=await fetch(cfg.backendUrl+sep+'t='+Date.now());
 return await r.json();
}
async function refresh(silent){
 if(!cfg.backendUrl)return false;
 try{
  const d=await apiGet();
  db.products=d.products||[];
  db.sales=(d.sales||[]).sort((a,b)=>b.ts-a.ts);
  db.exp=d.exp||[];
  if(d.settings){if(d.settings.store)cfg.store=d.settings.store;if(d.settings.qris!==undefined)cfg.qris=d.settings.qris;saveCfg()}
  lastSync=Date.now();
  return true;
 }catch(e){if(!silent)toast('Gagal memuat data, cek koneksi');return false}
}
async function flushQueue(){
 if(!queue.length||!cfg.backendUrl)return;
 const items=[...queue];
 for(const it of items){
  try{await api(it.action,it.payload);queue=queue.filter(x=>x.id!==it.id);saveQueue()}
  catch(e){break}
 }
}
function enqueue(action,payload){queue.push({id:uid(),action,payload});saveQueue()}
function pending(id){return queue.some(x=>x.payload&&((x.payload.data&&x.payload.data.id===id)||x.payload.id===id))}
function pendingBadge(id){return pending(id)?' <span class="chip2" style="background:var(--bd)">⏳ offline</span>':''}

async function boot(){
 show();
 if(cfg.backendUrl){await refresh();await flushQueue();await refresh(true)}
 booting=false;show();
 setInterval(poll,25000);
}
function poll(){
 if(!cfg.backendUrl||busy||$('#m').classList.contains('on'))return;
 busy=true;
 flushQueue().then(()=>refresh(true)).then(()=>{busy=false;if(tab!=='set')show()}).catch(()=>{busy=false})
}
boot();

 `<div class="row"><div onclick="cartOpen=!cartOpen;bar()" style="flex:1;cursor:pointer"><span class="mu">${count()} item · ${cartOpen?'tutup ▾':'lihat ▴'}</span><br><b style="font-size:21px;color:var(--mr)">${R(total())}</b></div><button class="btn g" onclick="cart={};cartOpen=false;show()">Batal</button><button class="btn big" onclick="pay()">Bayar</button></div>`}
function pay(){method='Tunai';window._tn='';const IC={Tunai:'💵',QRIS:'📱',Transfer:'🏦',Debit:'💳'};

function payUI(){const T=total();let h='';

 else if(method=='QRIS'){h=cfg.qris?`<div id="qr"></div><p class="mu" style="text-align:center;font-size:15px">Minta pembeli scan, nominal <b>${R(T)}</b> sudah terisi otomatis</p>`:'<div class="card mu">QRIS belum diatur. Tempel kode QRIS toko di tab Setelan.</div>'}

 if(method=='QRIS'&&cfg.qris){try{new QRCode($('#qr'),{text:qrisDyn(cfg.qris,T),width:320,height:320,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('#qr').textContent='Kode QRIS tidak valid'}}}

async function done(){const T=total();let paid=T;if(method=='Tunai'){paid=+$('#cash').value||T;if(paid<T){toast('Uang kurang');return}}
 const s={id:uid(),ts:Date.now(),items:db.products.filter(p=>cart[p.id]).map(p=>({name:p.name,price:p.price,qty:cart[p.id]})),total:T,method,paid,note:(window._tn||'').trim(),pic:cfg.pic||''};
 window._tn='';db.sales.unshift(s);cart={};cartOpen=false;receipt(s.id);show();

function receiptText(s){const w=32,line='-'.repeat(w),pad=(a,b)=>a+' '.repeat(Math.max(1,w-a.length-b.length))+b;
 let t=cfg.store+'\n'+new Date(s.ts).toLocaleString('id-ID')+'\nNo: '+s.id.toUpperCase()+'\n'+line+'\n';
 s.items.forEach(i=>{t+=i.name+'\n'+pad(`${i.qty} x ${R(i.price)}`,R(i.qty*i.price))+'\n'});
 t+=line+'\n'+pad('TOTAL',R(s.total))+'\n'+pad('Bayar ('+s.method+')',R(s.paid))+'\n';if(s.paid>s.total)t+=pad('Kembali',R(s.paid-s.total))+'\n';if(s.note)t+='Ket: '+s.note+'\n';if(s.pic)t+='Kasir: '+s.pic+'\n';return t+line+'\nTerima kasih! 💗\nget your PUGO to go'}

const APPS_SCRIPT=`var SHEET_ID = '1Xz5IAUmsVEQUFd-9BuKeiw4NJqIADVhuh_r6I0OT_Ls';
var LEDGER_GID = 1926895919;

function getSS(){ return SpreadsheetApp.openById(SHEET_ID); }

function sheet(name, headers){
  var ss = getSS();
  var sh = ss.getSheetByName(name);
  if(!sh){ sh = ss.insertSheet(name); sh.appendRow(headers); sh.setFrozenRows(1); }
  return sh;
}

function readRows(name, headers){
  var sh = sheet(name, headers);
  var rng = sh.getDataRange().getValues();
  if(rng.length < 2) return [];
  var head = rng[0];
  var out = [];
  for(var i=1;i<rng.length;i++){
    if(rng[i][0]==='') continue;
    var o = {};
    for(var j=0;j<head.length;j++) o[head[j]] = rng[i][j];
    out.push(o);
  }
  return out;
}

function json(o){
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function doGet(e){
  var products = readRows('Produk', ['id','name','price','note']);
  var salesRaw = readRows('Penjualan', ['id','ts','items','total','method','paid','note','pic']);
  var sales = salesRaw.map(function(s){
    var items = [];
    try{ items = JSON.parse(s.items || '[]'); }catch(err){}
    return { id:s.id, ts:Number(s.ts), items:items, total:Number(s.total), method:s.method, paid:Number(s.paid), note:s.note, pic:s.pic };
  });
  var exp = readRows('Pengeluaran', ['id','date','cat','desc','qty','unit','price','by','note']).map(function(x){
    return { id:x.id, date:x.date, cat:x.cat, desc:x.desc, qty:Number(x.qty), unit:x.unit, price:Number(x.price), by:x.by, note:x.note };
  });
  var setRows = readRows('Pengaturan', ['key','value']);
  var settings = {};
  setRows.forEach(function(r){ settings[r.key] = r.value; });
  return json({ products:products, sales:sales, exp:exp, settings:settings });
}

function saveRow(name, headers, data){
  var sh = sheet(name, headers);
  var rng = sh.getDataRange().getValues();
  var rowIdx = -1;
  for(var i=1;i<rng.length;i++){ if(String(rng[i][0])===String(data.id)){ rowIdx = i+1; break; } }
  var row = headers.map(function(h){ var v = data[h]; return (v===undefined||v===null) ? '' : v; });
  if(rowIdx>0){ sh.getRange(rowIdx,1,1,headers.length).setValues([row]); }
  else { sh.appendRow(row); }
}

function deleteRow(name, headers, id){
  var sh = sheet(name, headers);
  var rng = sh.getDataRange().getValues();
  for(var i=1;i<rng.length;i++){ if(String(rng[i][0])===String(id)){ sh.deleteRow(i+1); break; } }
}

function appendLedger(date, type, cat, desc, masuk, keluar, pic){
  var ss = getSS();
  var shs = ss.getSheets().filter(function(s){ return s.getSheetId()===LEDGER_GID; });
  if(!shs.length) return;
  var sh = shs[0];
  var v = sh.getRange('B1:B500').getValues();
  var last = 8;
  for(var i=8;i<v.length;i++){ if(v[i][0]!=='') last = i+1; }
  var r = last+1;
  sh.getRange(last,2,1,10).copyTo(sh.getRange(r,2,1,10));
  var no = (Number(sh.getRange(last,2).getValue())||0)+1;
  var bukti = 'BKK-'+('000'+no).slice(-3);
  sh.getRange(r,2,1,6).setValues([[no, date, bukti, type, cat, desc]]);
  sh.getRange(r,8,1,2).setValues([[masuk, keluar]]);
  sh.getRange(r,11).setValue(pic || '');
}

function doPost(e){
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try{
    var d = JSON.parse(e.postData.contents);
    var PH = ['id','name','price','note'];
    var SH_ = ['id','ts','items','total','method','paid','note','pic'];
    var EH = ['id','date','cat','desc','qty','unit','price','by','note'];
    if(d.action==='saveProduct'){
      saveRow('Produk', PH, d.data);
    } else if(d.action==='deleteProduct'){
      deleteRow('Produk', PH, d.id);
    } else if(d.action==='addSale'){
      var s = d.data;
      saveRow('Penjualan', SH_, Object.assign({}, s, { items: JSON.stringify(s.items) }));
      var q = s.items.reduce(function(a,i){return a+i.qty;},0);
      var desc = 'Penjualan Pugo ('+q+' pcs)'+(s.note?' - '+s.note:'');
      var dt = Utilities.formatDate(new Date(s.ts), 'Asia/Jakarta', 'yyyy-MM-dd');
      appendLedger(dt, 'Pemasukan', 'Pudot', desc, s.total, 0, s.pic);
    } else if(d.action==='addExpense'){
      saveRow('Pengeluaran', EH, d.data);
      appendLedger(d.data.date, 'Pengeluaran', d.data.cat, d.data.desc, 0, d.data.qty*d.data.price, d.data.by);
    } else if(d.action==='updateExpense'){
      saveRow('Pengeluaran', EH, d.data);
    } else if(d.action==='deleteExpense'){
      deleteRow('Pengeluaran', EH, d.id);
    } else if(d.action==='saveSettings'){
      saveRow('Pengaturan', ['key','value'], { id:'store', key:'store', value:d.data.store });
      saveRow('Pengaturan', ['key','value'], { id:'qris', key:'qris', value:d.data.qris });
    } else {
      return json({ ok:false, error:'unknown action' });
    }
    return json({ ok:true });
  } catch(err){
    return json({ ok:false, error:String(err) });
  } finally {
    lock.releaseLock();
  }
}`;
